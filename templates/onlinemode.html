<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Communication - Silent Voice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        /* --- THEME CONFIG --- */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            /* Using a dark placeholder or your campus image */
            background-image: var(--bg-img, url('https://images.shiksha.com/mediadata/images/articles/1663312168phpn90Wh7.jpeg'));
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
        }

        .page-overlay {
            position: fixed; inset: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            z-index: 0;
        }

        /* --- SENSOR BARS --- */
        .sensor-bar-bg {
            width: 100%; height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 8px;
        }
        .sensor-fill {
            height: 100%;
            background: linear-gradient(90deg, #4f46e5, #818cf8);
            width: 0%;
            transition: width 0.2s ease-out; /* Smooth transition */
        }

        /* --- TERMINAL EFFECT --- */
        .terminal-box {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6);
            min-height: 300px;
            display: flex; flex-direction: column;
        }
        
        .cursor-blink {
            display: inline-block;
            width: 10px; height: 1.2em;
            background-color: #4ade80;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 5px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* --- CONNECT BUTTON PULSE --- */
        .pulse-ring {
            position: absolute; inset: -4px;
            border-radius: 50%;
            border: 2px solid #ef4444;
            opacity: 0;
        }
        .connected .pulse-ring {
            border-color: #10b981;
            animation: ringPulse 2s infinite;
        }
        @keyframes ringPulse { 0% {transform: scale(1); opacity: 1;} 100% {transform: scale(1.5); opacity: 0;} }

    </style>
</head>
<body>
    <div class="page-overlay"></div>

    <header class="fixed top-0 w-full z-40 bg-slate-900/80 backdrop-blur border-b border-white/10">
        <div class="max-w-7xl mx-auto flex justify-between items-center px-6 py-4">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <div id="status-dot" class="w-3 h-3 bg-red-500 rounded-full z-10 relative"></div>
                    <div id="status-ring" class="pulse-ring"></div>
                </div>
                <span id="status-text" class="font-bold text-slate-300 tracking-tight">Glove Disconnected</span>
            </div>
            
            <a href="index.html" class="flex items-center gap-2 text-sm font-semibold text-slate-400 hover:text-white transition">
                <span>←</span> Dashboard
            </a>
        </div>
    </header>

    <main class="relative z-10 pt-28 pb-10 px-6 max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <div class="lg:col-span-1 space-y-6">
            
            <div class="bg-slate-800/60 backdrop-blur rounded-2xl p-6 border border-white/10">
                <h2 class="text-xl font-bold mb-4 font-[Poppins]">Hardware Status</h2>
                <p class="text-sm text-slate-400 mb-6">Connect your ESP32 glove via USB/Server to start translating gestures.</p>
                
                <button id="connect-btn" onclick="toggleConnection()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                    <span>Connect Glove</span>
                </button>
            </div>

            <div class="bg-slate-800/60 backdrop-blur rounded-2xl p-6 border border-white/10">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-slate-300">Flex Sensors</h3>
                    <span class="text-xs bg-slate-700 px-2 py-1 rounded text-slate-400">Live Data</span>
                </div>

                <div class="mb-4">
                    <div class="flex justify-between text-xs text-slate-400 mb-1">
                        <span>Thumb</span> <span id="val-1">0</span>
                    </div>
                    <div class="sensor-bar-bg"><div id="bar-1" class="sensor-fill"></div></div>
                </div>
                <div class="mb-4">
                    <div class="flex justify-between text-xs text-slate-400 mb-1">
                        <span>Index</span> <span id="val-2">0</span>
                    </div>
                    <div class="sensor-bar-bg"><div id="bar-2" class="sensor-fill"></div></div>
                </div>
                <div class="mb-4">
                    <div class="flex justify-between text-xs text-slate-400 mb-1">
                        <span>Middle</span> <span id="val-3">0</span>
                    </div>
                    <div class="sensor-bar-bg"><div id="bar-3" class="sensor-fill"></div></div>
                </div>
                <div class="mb-4">
                    <div class="flex justify-between text-xs text-slate-400 mb-1">
                        <span>Ring</span> <span id="val-4">0</span>
                    </div>
                    <div class="sensor-bar-bg"><div id="bar-4" class="sensor-fill"></div></div>
                </div>
                <div>
                    <div class="flex justify-between text-xs text-slate-400 mb-1">
                        <span>Pinky</span> <span id="val-5">0</span>
                    </div>
                    <div class="sensor-bar-bg"><div id="bar-5" class="sensor-fill"></div></div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-2 flex flex-col h-full">
            
            <div class="terminal-box flex-grow p-6 relative mb-6">
                <div class="absolute top-4 right-4 flex gap-2">
                    <span class="w-3 h-3 rounded-full bg-red-500/20 border border-red-500"></span>
                    <span class="w-3 h-3 rounded-full bg-yellow-500/20 border border-yellow-500"></span>
                    <span class="w-3 h-3 rounded-full bg-green-500/20 border border-green-500"></span>
                </div>
                <div class="text-slate-500 text-xs font-mono mb-4 uppercase tracking-widest">Incoming Signal Translation</div>
                
                <div id="output-text" class="text-3xl md:text-4xl font-bold text-white leading-relaxed font-[Poppins] h-full overflow-y-auto">
                    <span class="text-slate-600">Waiting for gestures...</span>
                </div>
                <div class="mt-4"><span class="cursor-blink"></span></div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <button onclick="speakText()" class="col-span-2 md:col-span-2 py-4 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold shadow-lg transition flex items-center justify-center gap-2">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>
                    SPEAK
                </button>
                <button onclick="clearText()" class="py-4 bg-slate-800 hover:bg-slate-700 border border-white/10 rounded-xl font-bold transition">
                    CLEAR
                </button>
                <div class="py-4 bg-slate-800 border border-white/10 rounded-xl flex items-center justify-center gap-3 px-4">
                    <span class="text-xs font-bold text-slate-400">AUTO SPEAK</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="auto-speak" class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                    </label>
                </div>
            </div>

        </div>
    </main>

    <script>
        let isConnected = false;
        let fetchInterval;
        let lastText = "";
        const synth = window.speechSynthesis;

        // --- 1. CONNECTION TOGGLE ---
        function toggleConnection() {
            const btn = document.getElementById('connect-btn');
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            const ring = document.getElementById('status-ring');

            if (!isConnected) {
                // STATUS: CONNECTING...
                btn.innerText = "Connecting...";
                
                // Test connection to Python server
                fetch('http://127.0.0.1:5000/data')
                    .then(() => {
                        // SUCCESS
                        isConnected = true;
                        btn.innerHTML = `<span>Stop Connection</span>`;
                        btn.classList.replace('bg-indigo-600', 'bg-red-600');
                        btn.classList.replace('hover:bg-indigo-500', 'hover:bg-red-500');
                        
                        statusDot.classList.replace('bg-red-500', 'bg-emerald-500');
                        statusText.innerText = "Glove Connected";
                        statusText.classList.add('text-emerald-400');
                        ring.parentElement.classList.add('connected');

                        startDataStream();
                    })
                    .catch(() => {
                        alert("Cannot connect to Python! \n\n1. Make sure app.py is running.\n2. Check if the terminal says 'Web Server running'.");
                        btn.innerHTML = `<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg><span>Connect Glove</span>`; // Reset button
                    });

            } else {
                // STOP CONNECTION
                isConnected = false;
                stopDataStream();

                btn.innerHTML = `<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg><span>Connect Glove</span>`;
                btn.classList.replace('bg-red-600', 'bg-indigo-600');
                btn.classList.replace('hover:bg-red-500', 'hover:bg-indigo-500');

                statusDot.classList.replace('bg-emerald-500', 'bg-red-500');
                statusText.innerText = "Glove Disconnected";
                statusText.classList.remove('text-emerald-400');
                ring.parentElement.classList.remove('connected');
            }
        }

        // --- 2. DATA STREAMING (REAL) ---
        function startDataStream() {
            // Fetch data every 500ms
            fetchInterval = setInterval(async () => {
                try {
                    const response = await fetch('http://127.0.0.1:5000/data');
                    if (!response.ok) throw new Error("Server Error");
                    
                    const data = await response.json();
                    updateInterface(data);

                } catch (error) {
                    console.error("Connection lost:", error);
                    // Optional: Toggle off if persistent error
                }
            }, 500);
        }

        function stopDataStream() {
            clearInterval(fetchInterval);
        }

        // --- 3. UI UPDATE ---
        function updateInterface(data) {
            // A. Update Sensor Bars (Visual Only if backend sends them)
            if (data.sensors) {
                for (let i = 0; i < 5; i++) {
                    const val = data.sensors[i];
                    document.getElementById(`val-${i+1}`).innerText = val;
                    // Visualize: 0-100% (assuming max sensor val ~100 for flex)
                    document.getElementById(`bar-${i+1}`).style.width = `${val}%`;
                }
            }

            // B. Update Text
            const output = document.getElementById('output-text');
            const incomingText = data.text;

            // Only update if the text is new and not empty
            if (incomingText && incomingText !== lastText && incomingText !== "Waiting for gesture...") {
                
                if (output.innerText.includes("Waiting")) output.innerHTML = "";

                // Display new text with animation
                output.innerHTML = `<span class="text-white animate-pulse">${incomingText}</span>`;
                lastText = incomingText;

                // Check Auto Speak
                const autoSpeak = document.getElementById('auto-speak').checked;
                if (autoSpeak) {
                    speakText(incomingText);
                }
            }
        }

        // --- 4. TEXT TO SPEECH ---
        function speakText(textOverride) {
            const text = textOverride || document.getElementById('output-text').innerText;
            
            if (!text || text.includes("Waiting")) return;

            synth.cancel(); // Stop previous speech

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1;
            utterance.pitch = 1;
            
            // Try to find a good English voice
            const voices = synth.getVoices();
            const voice = voices.find(v => v.name.includes("Google") && v.lang.includes("en")) || voices[0];
            if (voice) utterance.voice = voice;

            synth.speak(utterance);
        }

        function clearText() {
            document.getElementById('output-text').innerHTML = '<span class="text-slate-600">Waiting for gestures...</span>';
            lastText = "";
        }

        // Fix for Chrome voice loading
        window.speechSynthesis.onvoiceschanged = () => {};

    </script>
</body>
</html>
